<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>snippet</title>
  <style>
    /* Inline styles ensure the loader renders instantly without waiting for CSS files */
    .preloader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: sans-serif;
    }
  </style>
</head>

<body>
  <!-- For Vue projects, change 'root' to 'app' -->
  <div id="root">
    <!-- Everything inside this div will be replaced when the app mounts -->
    <div class="preloader-container">
      <div class="loading-text"><img src="/favicon.svg" alt=""></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
